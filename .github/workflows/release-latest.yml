name: Prepare latest production release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: prepare-latest-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve latest successful service builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve latest successful CI SHAs and create release tag
        uses: actions/github-script@v7
        with:
          script: |
            const services = [
              { repo: 'KTB4-13th-FE', key: 'frontend_sha' },
              { repo: 'KTB4-13th-BE', key: 'backend_sha' },
              { repo: 'KTB4-13th-AI', key: 'ai_sha' },
            ];

            const shas = {};
            for (const service of services) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: service.repo,
                branch: 'main',
                status: 'success',
                per_page: 20,
              });

              const run = data.workflow_runs.find((candidate) =>
                candidate.event === 'push' && candidate.head_sha
              );
              if (!run) {
                core.setFailed(`${service.repo}에 성공한 main CI가 없습니다.`);
                return;
              }
              shas[service.key] = run.head_sha;
            }

            const release = `v0.0.${Math.floor(Date.now() / 1000)}`;
            const path = `releases/${release}.yml`;
            const content = [
              `release: ${release}`,
              `frontend_sha: ${shas.frontend_sha}`,
              `backend_sha: ${shas.backend_sha}`,
              `ai_sha: ${shas.ai_sha}`,
              '',
            ].join('\n');

            let existingSha;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              existingSha = existing.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: commit } = await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore: 최신 성공 빌드 Release 생성`,
              content: Buffer.from(content).toString('base64'),
              branch: 'main',
              sha: existingSha,
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${release}`,
              sha: commit.commit.sha,
            });

            core.notice(`${release} Release를 생성했습니다.`);
            core.notice(JSON.stringify(shas));
